<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <form class="contact_form">
        <h1>Contact Us</h1>
        <div class="name_last">
          <div class="name column">
            <label for="userName" id="margin">First Name *</label>
            <input type="text" id="userName" />
          </div>
          <div class="lastname column">
            <label for="lastname" id="margin">Last Name *</label>
            <input type="text" id="lastname" />
          </div>
        </div>
        <div class="email column">
          <label for="email" id="margin">Email Address *</label>
          <input type="email" id="email" />
        </div>
        <div class="Query">
          <label for="question_name">Query Type *</label>
          <div class="query_type">
            <div class="first_one">
              <input
                type="radio"
                id="first_answer"
                name="query"
                value="General Enquiry"
              />
              <label for="first_answer" id="style">General Enquiry</label>
            </div>
            <div class="second_one">
              <input
                type="radio"
                id="second_answer"
                name="query"
                value="Support Request"
              />
              <label for="second_answer" id="style">Support Request</label>
            </div>
          </div>
        </div>
        <div class="message column">
          <label for="text" id="margin">Message *</label>
          <textarea name="text" id="text"></textarea>
        </div>
        <div class="terms">
          <input type="checkbox" name="terms" id="terms" />
          <label for="terms" id="term"
            >I consent to being contacted by the team *</label
          >
        </div>
        <span id="error_message"></span>
        <button class="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
